steps:
  - await:
      visible:
        id: onboarding-continue
  - tap:
      id: onboarding-continue
  - await:
      visible:
        text: Predictive Fueling
  - await:
      idle: true
  - tap:
      id: onboarding-continue
  - await:
      visible:
        text: Enable Location
  - await:
      idle: true
  - tap:
      id: onboarding-continue
  - await:
      visible:
        text: Allow Live Activities
  - await:
      idle: true
  - tap:
      id: onboarding-continue
  - await:
      visible:
        text: Search Nearby
  - await:
      idle: true
  - tap:
      id: onboarding-continue
  - await:
      visible:
        text: Your Fuel
  - await:
      idle: true
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: E85
  - tap:
      x: 0.5
      y: 0.565
  - await:
      visible:
        text: Get Started
  - tap:
      id: onboarding-continue
  - await:
      visible:
        text: Settings
  - await:
      idle: true
executionPrerequisite: "Fuel Up is on its onboarding welcome page on iPhone 17
  Pro Max (440 x 956 points), default text size, location and notification
  permissions granted. Changes the fuel type to E85. The SwiftUI Picker row
  requires one coordinate tap: its AX label is visible, but Argent UIKit
  projection cannot expose the SwiftUI row even with testID. All other taps use
  stable identifiers."
